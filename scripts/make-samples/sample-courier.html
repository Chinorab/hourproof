<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{background:#101418;color:#F2F4F5}
.top{padding:44px 20px 16px;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;background:#FF7A3D;display:grid;place-items:center;font-weight:800;color:#101418}
h1{font-size:18px}
.range{padding:0 20px;color:#9AA4AC;font-size:14px}
.big{padding:18px 20px 6px;font-size:44px;font-weight:800}
.lbl{padding:0 20px 20px;color:#9AA4AC;font-size:13px}
.card{margin:0 16px 12px;background:#1B2228;border-radius:14px;padding:14px 16px}
.row{display:flex;justify-content:space-between;padding:9px 0;font-size:15px;border-bottom:1px solid #2A333A}
.row:last-child{border:0}
.muted{color:#9AA4AC}
</style></head><body>
<div class="sample">SAMPLE DATA · FICTIONAL APP</div>
<div class="top"><div class="logo">S</div><h1>Sample Courier Earnings</h1></div>
<div class="range">Weekly summary · Sep 28 to Oct 4</div>
<div class="big">$236.40</div><div class="lbl">Total earnings this week</div>
<div class="card">
 <div class="row"><span class="muted">Delivery pay</span><span>$171.15</span></div>
 <div class="row"><span class="muted">Customer tips</span><span>$65.25</span></div>
 <div class="row"><span class="muted">Deliveries</span><span>31</span></div>
</div>
<div class="card">
 <div class="row"><span class="muted">Active time</span><span>14h 35m</span></div>
 <div class="row"><span class="muted">Online time</span><span>21h 10m</span></div>
</div>
<div class="wm">SAMPLE</div></body></html>
